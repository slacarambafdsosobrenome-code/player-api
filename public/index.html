<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>PipocaFlix • Player</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at 50% 30%,#2a0d0f,#000 70%);color:#fff;font-family:Roboto,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
main{max-width:460px;width:100%;text-align:center}
h1{font-size:13px;letter-spacing:.34em;color:#ff2a2a;margin-bottom:18px}
p{font-size:15px;line-height:1.6;color:rgba(255,255,255,.75)}
ul{list-style:none;margin:18px 0 0;text-align:left}
li{padding:12px 16px;margin-top:10px;border-radius:14px;background:rgba(255,255,255,.07);font-size:14px;color:rgba(255,255,255,.8)}
code{font-family:ui-monospace,Menlo,Consolas,monospace;color:#fff;font-weight:700}
</style>
</head>
<body>
<main>
  <h1>PIPOCAFLIX</h1>
  <p>Player de filmes e séries. Abra o endereço da linha da planilha:</p>
  <ul>
    <li><b>Filme:</b> <code>/P1555</code> &rarr; linha 1555 da planilha de filmes</li>
    <li><b>Série:</b> <code>/5/12</code> &rarr; aba 5, linha 12 da planilha de séries</li>
  </ul>
</main>
</body>
</html>
